name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java 11 e 17 (Java 11 é obrigatório para o sdkmanager antigo)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            11
            17

      - name: Install Linux packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev build-essential libstdc++6 aidl curl

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install cython buildozer

      - name: Preparar Android SDK Isolado com sdkmanager e Licenças
        run: |
          # 1. Criar a pasta exata que o Buildozer vai gerir
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # 2. Descarregar os Command Line Tools oficiais da Google (versão estável compatível com Java 11)
          curl -L -o cmd-tools.zip https://google.com
          unzip -q cmd-tools.zip
          
          # 3. Organizar na estrutura que o Buildozer e o Android exigem (cmdline-tools/latest/bin)
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
          rm -rf cmdline-tools cmd-tools.zip

          # 4. Criar o atalho (link simbólico) na pasta "tools" que o Buildozer procura ativamente
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          # 5. Injetar manualmente as assinaturas das licenças (garantia extra)
          echo -e "\n8933bad161d74778b1f5b0028a1265521346616e\nd56f5187479451eabf01fb743130245313541d83\n24333f1a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          # 6. Forçar a aceitação interativa de todas as licenças usando o Java 11 antes do Buildozer rodar
          export JAVA_HOME=/usr/lib/jvm/temurin-11-jdk-amd64
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses || true

      - name: Build APK
        env:
          # Força o uso do Java 11 para que os subcomandos do sdkmanager do Buildozer não quebrem com a licença 37
          JAVA_HOME: /usr/lib/jvm/temurin-11-jdk-amd64
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorDeVoo-APK
          path: bin/*.apk
