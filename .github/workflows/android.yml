name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. Obter o projeto
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ------------------------------------------------------------
      # 3. Dependências Linux
      # ------------------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libstdc++6 \
            libcairo2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev


      # ------------------------------------------------------------
      # 4. Instalar Buildozer
      # ------------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.37"


      # ------------------------------------------------------------
      # 5. Aceitar licenças Android
      # ------------------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi


      # ------------------------------------------------------------
      # 6. Cache do Buildozer
      # ------------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ------------------------------------------------------------
      # 7. Construir APK
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug


      # ------------------------------------------------------------
      # 8. Disponibilizar APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorDeVoo-APK
          path: bin/*.apk