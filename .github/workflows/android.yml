name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0
          python -m pip install Cython==0.29.37

      - name: Install application dependencies
        run: |
          python -m pip install \
            kivy==2.3.1 \
            kivymd==2.0.0 \
            materialyoucolor==0.1.5 \
            materialshapes==0.3 \
            asynckivy==0.6.4 \
            asyncgui==0.6.3 \
            pillow

      - name: Check configuration
        run: |
          python --version
          python -m pip --version
          buildozer --version
          cython --version
          autoconf --version
          automake --version
          libtool --version

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List generated files
        if: always()
        run: |
          echo "===== BIN ====="
          ls -lah bin || true

          echo "===== APK FILES ====="
          find bin -maxdepth 1 -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-de-Voo-APK
          path: bin/*.apk
          if-no-files-found: error