name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ccache

          sudo apt-get install --reinstall -y libtool libtool-bin

          echo "PATH atual:"
          echo "$PATH"

          echo "Localização do libtool:"
          command -v libtool

          echo "Versão do libtool:"
          libtool --version

      - name: Verify build tools
        run: |
          python --version
          python -m pip --version
          autoconf --version
          automake --version
          libtool --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37" \
            "kivy==2.3.1" \
            "kivymd==2.0.0" \
            "materialyoucolor==3.0.4" \
            "materialshapes==0.3" \
            "asynckivy==0.6.4" \
            "asyncgui==0.6.3"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          yes | sdkmanager --licenses || true

          mkdir -p "$ANDROID_HOME/licenses"

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$ANDROID_HOME/licenses/android-sdk-license"

          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            >> "$ANDROID_HOME/licenses/android-sdk-license"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

      - name: Build APK
        run: |
          buildozer android clean
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorDeVoo-APK
          path: bin/*.apk
          if-no-files-found: error