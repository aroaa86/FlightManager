name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java 11 e 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            11
            17

      - name: Install Linux packages
        run: |
          sudo apt update
          # Instalamos também o 'android-sdk' do próprio Ubuntu para termos o sdkmanager nativo e funcional
          sudo apt install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev build-essential libstdc++6 aidl android-sdk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install cython buildozer

      - name: Preparar Android SDK Isolado e Licenças (Sem Downloads Externos)
        run: |
          # 1. Criar a estrutura de pastas exata que o Buildozer exige
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # 2. Criar o atalho apontando para o sdkmanager nativo do Ubuntu (evita o erro do "does not exist")
          ln -s /usr/lib/android-sdk/tools/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          # 3. Injetar manualmente as assinaturas das licenças para prevenir o bloqueio do Build-Tools 37
          echo -e "\n8933bad161d74778b1f5b0028a1265521346616e\nd56f5187479451eabf01fb743130245313541d83\n24333f1a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          # 4. Aceitar todas as licenças do sistema usando o Java 11
          export JAVA_HOME=/usr/lib/jvm/temurin-11-jdk-amd64
          yes | sdkmanager --licenses || true

      - name: Build APK
        env:
          # Força o uso do Java 11 para evitar falhas de sintaxe na compilação do Android SDK
          JAVA_HOME: /usr/lib/jvm/temurin-11-jdk-amd64
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorDeVoo-APK
          path: bin/*.apk
