name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Compilar APK usando Docker Oficial do Buildozer
        run: |
          mkdir -p .buildozer
          
          # Executa o contentor passando a variável que autoriza rodar como root
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostdir \
            -v ${{ github.workspace }}/.buildozer:/home/user/.buildozer \
            -e _BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT=1 \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorDeVoo-APK
          path: bin/*.apk
